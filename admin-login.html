<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login - Portfolio</title>
    <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      .login-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        padding: 2rem;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 192, 4, 0.2);
        border-radius: 16px;
        padding: 2.5rem;
        max-width: 400px;
        width: 100%;
      }

      .login-card h1 {
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
      }

      .form-group {
        margin-bottom: 1.25rem;
        text-align: left;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--gold);
        font-weight: 600;
      }

      .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(255, 192, 4, 0.3);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: 1rem;
        box-sizing: border-box;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 2px rgba(255, 192, 4, 0.2);
      }

      .login-btn {
        width: 100%;
        padding: 0.875rem;
        background: var(--gold);
        color: #000;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .login-btn:hover {
        background: #e6ac00;
      }

      .login-btn:active {
        transform: scale(0.98);
      }

      .login-btn:disabled {
        background: #666;
        cursor: not-allowed;
      }

      .error-message {
        background: rgba(220, 53, 69, 0.2);
        border: 1px solid rgba(220, 53, 69, 0.5);
        color: #ff6b6b;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .success-message {
        background: rgba(40, 167, 69, 0.2);
        border: 1px solid rgba(40, 167, 69, 0.5);
        color: #51cf66;
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
        display: none;
      }

      .success-message.show {
        display: block;
      }

      .back-link {
        margin-top: 1.5rem;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 0.9rem;
      }

      .back-link:hover {
        color: var(--gold);
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <h1>Admin Login</h1>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Brukernavn</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              autocomplete="username"
              placeholder="Skriv inn brukernavn"
            />
          </div>

          <div class="form-group">
            <label for="password">Passord</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Skriv inn passord"
            />
          </div>

          <button type="submit" id="loginBtn" class="login-btn">
            Logg inn
          </button>
        </form>

        <a href="index.html" class="back-link">&larr; Tilbake til forsiden</a>
      </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const loginBtn = document.getElementById("loginBtn");
      const errorMessage = document.getElementById("errorMessage");
      const successMessage = document.getElementById("successMessage");

      // Check if already logged in
      if (AuthModule.isAuthenticated()) {
        window.location.href = "admin.html";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        // Reset messages
        errorMessage.classList.remove("show");
        successMessage.classList.remove("show");

        // Disable button and show loading
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span>Logger inn...';

        try {
          const result = await AuthModule.login(username, password);

          if (result.success) {
            successMessage.textContent = "Innlogget! Videresender...";
            successMessage.classList.add("show");

            setTimeout(() => {
              window.location.href = "admin.html";
            }, 1000);
          } else {
            errorMessage.textContent =
              result.message || "Feil brukernavn eller passord";
            errorMessage.classList.add("show");
            loginBtn.disabled = false;
            loginBtn.textContent = "Logg inn";
          }
        } catch (error) {
          errorMessage.textContent = "Kunne ikke koble til server. Prøv igjen.";
          errorMessage.classList.add("show");
          loginBtn.disabled = false;
          loginBtn.textContent = "Logg inn";
          console.error("Login error:", error);
        }
      });
    </script>
  </body>
</html>
