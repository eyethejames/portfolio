<!DOCTYPE html>
<html>
  <head>
    <title>Test Visitor Log</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
        background: #f4f4f4;
      }
      pre {
        background: white;
        padding: 1rem;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h2>Visitor Log Test</h2>
    <button onclick="send()" style="padding: 1rem 2rem; font-size: 1.2rem">
      Send Test Visit
    </button>
    <pre id="log"></pre>

    <script>
      function send() {
        const log = document.getElementById("log");
        log.textContent = "Sending...\n";

        fetch(
          "https://script.google.com/macros/s/AKfycbzKAfhF6Y74Ulpq0DCPLRLPQGkYfJ0yqgUx-7TOr0fcB4xjLipvvMsoLkFNntR6ej1tJA/exec",
          {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: "testuser",
              myName: "Jakob",
              color: "Blood Red",
              hue: 0,
            }),
          }
        );

        log.textContent += "Request sent!\n";
        log.textContent += "Check Google Sheet in 5 seconds.";
      }
    </script>
  </body>
</html>
